<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>goGreen Splash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .bike-icon {
      width: 72px;
      height: 72px;
      stroke: #22c55e;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.5));
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .loader-bar {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 32px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      width: 40%;
      height: 100%;
      background: #22c55e;
      border-radius: 2px;
      position: absolute;
      animation: loading 1.6s ease-in-out infinite;
    }
    @keyframes loading {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: -40%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg class="bike-icon" viewBox="0 0 24 24">
      <circle cx="5.5" cy="17.5" r="3.5" />
      <circle cx="18.5" cy="17.5" r="3.5" />
      <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2z" />
      <path d="M12 17.5V14l-3-3 4-3 2 3h3" />
      <path d="M5.5 17.5l3.5-9.5h3" />
    </svg>
  </div>
  <div class="title">goGreen</div>
  <div class="subtitle">Pedal Tracking & Telemetry</div>
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
</body>
</html>
